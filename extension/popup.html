<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SentinelMesh</title>
    <style>
      :root {
        --brand-300: #c4b5fd;
        --brand-400: #a78bfa;
        --brand-500: #8b5cf6;
        --brand-600: #7c3aed;
        --status-good: #0ca30c;
        --status-warning: #fab219;
        --status-critical: #d03b3b;
        --surface-page: #09090b;
        --surface-card: #111113;
        --surface-raised: #18181b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 300px;
        margin: 0;
        background: var(--surface-page);
        color: #e4e4e7;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .header img {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
      }
      .header h1 {
        font-size: 14px;
        font-weight: 700;
        margin: 0;
        color: #fff;
      }
      .header p {
        margin: 1px 0 0;
        font-size: 11px;
        color: #71717a;
      }
      .body {
        padding: 14px 16px 16px;
      }
      .card {
        background: var(--surface-card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .status-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .status-left {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--status-good);
        flex-shrink: 0;
      }
      .dot.off {
        background: #52525b;
        animation: none !important;
      }
      @keyframes pulse-ring {
        0% {
          box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.5);
        }
        100% {
          box-shadow: 0 0 0 6px rgba(12, 163, 12, 0);
        }
      }
      .dot:not(.off) {
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .status-label {
        font-weight: 600;
        font-size: 12.5px;
        color: #e4e4e7;
      }
      .status-sub {
        font-size: 11px;
        color: #71717a;
        margin-top: 1px;
      }
      .switch {
        position: relative;
        width: 34px;
        height: 19px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: #27272a;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 15px;
        height: 15px;
        left: 2px;
        top: 2px;
        background: white;
        border-radius: 50%;
        transition: transform 0.15s;
      }
      input:checked + .slider {
        background: var(--brand-600);
      }
      input:checked + .slider::before {
        transform: translateX(15px);
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--brand-400);
        text-decoration: none;
        font-size: 11.5px;
        font-weight: 600;
      }
      .link:hover {
        color: var(--brand-300);
      }
      .link svg {
        width: 11px;
        height: 11px;
      }
      .version {
        font-size: 10.5px;
        color: #52525b;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img src="icons/icon128.png" alt="" />
      <div>
        <h1>SentinelMesh</h1>
        <p>Wallet Shield, in Phantom</p>
      </div>
    </div>

    <div class="body">
      <div class="card">
        <div class="status-row">
          <div class="status-left">
            <span class="dot" id="statusDot"></span>
            <div>
              <div class="status-label" id="statusLabel">Protected</div>
              <div class="status-sub" id="statusSub">Checking every signature</div>
            </div>
          </div>
          <label class="switch">
            <input type="checkbox" id="enabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="footer">
        <a class="link" href="https://dpk3244zw4bn0.cloudfront.net" target="_blank" rel="noopener">
          Open Dashboard
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        </a>
        <span class="version">v0.1.0</span>
      </div>
    </div>
    <script src="dist/popup.js"></script>
  </body>
</html>
