name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC -> AWS role assumption, no stored keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # let an in-flight deploy finish rather than leaving things half-updated

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync frontend/dist/ s3://${{ vars.FRONTEND_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_FRONTEND_DIST_ID }} --paths "/*"

  deploy-backend:
    runs-on: ubuntu-latest
    container: amazonlinux:2023
    steps:
      - name: Install build tooling
        run: |
          dnf install -y gcc gcc-c++ make pkgconfig openssl-devel perl git tar xz findutils unzip
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          ./aws/install

      - uses: actions/checkout@v4

      - name: Build release binary
        working-directory: backend
        run: |
          source "$HOME/.cargo/env"
          cargo build --release
          strip target/release/sentinelmesh-backend

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload binary and deploy script to S3
        run: |
          aws s3 cp backend/target/release/sentinelmesh-backend "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/${{ github.sha }}/sentinelmesh-backend"
          aws s3 cp backend/scripts/deploy-remote.sh "s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/deploy-remote.sh"

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.BACKEND_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"aws s3 cp s3://${{ vars.DEPLOY_ARTIFACTS_BUCKET }}/deploy-remote.sh /tmp/deploy-remote.sh\", \"chmod +x /tmp/deploy-remote.sh\", \"/tmp/deploy-remote.sh ${{ vars.DEPLOY_ARTIFACTS_BUCKET }} ${{ github.sha }}\"]" \
            --query "Command.CommandId" --output text)
          echo "Waiting for deploy to finish (command $COMMAND_ID)..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.BACKEND_INSTANCE_ID }}" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.BACKEND_INSTANCE_ID }}" --query "Status" --output text)
          echo "=== Deploy output ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.BACKEND_INSTANCE_ID }}" --query "StandardOutputContent" --output text
          echo "=== Deploy errors (if any) ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.BACKEND_INSTANCE_ID }}" --query "StandardErrorContent" --output text
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
